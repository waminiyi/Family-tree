<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light">
<title>Arbre familial</title>
<style>
:root { --bg:#f4f5f7; --panel:#ffffff; --text:#161a22; --muted:#5b6572; --border:#cfd5de; --accent:#1d4ed8; --accent-text:#ffffff; --danger:#b91c1c; --focus:#f59e0b; --radius:10px; --font:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { height:100%; margin:0; }
body { font-family:var(--font); color:var(--text); background:var(--bg); display:flex; flex-direction:column; overflow:hidden; -webkit-text-size-adjust:100%; }
button, input, select, textarea { font:inherit; color:inherit; }
:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
.ic { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }

/* top bar */
.bar { display:flex; align-items:center; gap:8px; padding:6px 10px; background:var(--panel); border-bottom:1px solid var(--border); flex-wrap:nowrap; z-index:5; padding-top:max(6px, env(safe-area-inset-top)); }
.bar h1 { font-size:17px; margin:0 6px 0 0; white-space:nowrap; }
.search { position:relative; flex:1 1 140px; min-width:110px; max-width:360px; display:flex; align-items:center; }
.search .ic { position:absolute; left:8px; color:var(--muted); pointer-events:none; }
.search input { width:100%; padding:9px 10px 9px 34px; border:1px solid var(--border); border-radius:20px; background:#fff; min-height:40px; }
#searchResults, #existingResults { position:absolute; top:100%; left:0; right:0; background:#fff; border:1px solid var(--border); border-radius:10px; margin:4px 0 0; padding:4px; list-style:none; max-height:260px; overflow:auto; z-index:20; box-shadow:0 8px 24px rgba(0,0,0,.15); }
#existingResults { position:static; margin-top:6px; }
#searchResults li, #existingResults li { padding:10px 12px; border-radius:6px; cursor:pointer; min-height:44px; display:flex; flex-direction:column; justify-content:center; }
#searchResults li:hover, #searchResults li[aria-selected="true"], #existingResults li:hover, #existingResults li[aria-selected="true"] { background:#e8efff; }
#searchResults small, #existingResults small { color:var(--muted); }
.actions { display:flex; gap:4px; margin-left:auto; position:relative; align-items:center; }
.tb { display:inline-flex; align-items:center; gap:6px; min-height:40px; min-width:40px; padding:6px 10px; border:1px solid transparent; border-radius:8px; background:transparent; cursor:pointer; white-space:nowrap; }
.tb:hover { background:#eef1f5; }
.tb.primary { background:var(--accent); color:var(--accent-text); }
.tb.primary:hover { background:#1e40af; }
.tb:disabled { opacity:.4; cursor:default; }
.menu { position:absolute; right:0; top:100%; background:#fff; border:1px solid var(--border); border-radius:10px; padding:6px; display:flex; flex-direction:column; gap:2px; min-width:260px; box-shadow:0 8px 24px rgba(0,0,0,.15); z-index:30; }
.menu button { text-align:left; padding:12px 14px; min-height:44px; border:0; background:transparent; border-radius:6px; cursor:pointer; }
.menu button:hover { background:#eef1f5; }
@media (max-width: 1100px) { .tb span { display:none; } .tb { padding:6px; } }
.menu .narrow { display:none; }
@media (max-width: 760px) { .bar h1 { display:none; } .bar { gap:2px; padding:6px; } .search { flex:1 1 90px; } #btnOpen, #btnSave, #btnRedo, #btnSettings, #btnHelp { display:none; } .menu .narrow { display:block; } }
@media (max-width: 480px) { .cardbar .name { display:none; } }

/* main */
#main { position:relative; flex:1; min-height:0; }
#tree { display:block; width:100%; height:100%; touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none; }
#tree:active { cursor:grabbing; }
#tree:focus-visible { outline:3px solid var(--focus); outline-offset:-3px; }
.empty { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:24px; text-align:center; }
.empty p { max-width:420px; color:var(--muted); font-size:17px; margin:0; }
.empty .row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
.big { font-size:18px; padding:16px 26px; border-radius:14px; border:1px solid var(--border); background:#fff; cursor:pointer; min-height:56px; }
.big.primary { background:var(--accent); color:#fff; border-color:var(--accent); font-size:21px; padding:18px 32px; box-shadow:0 6px 20px rgba(29,78,216,.3); }
.cardbar { position:absolute; display:flex; align-items:center; gap:2px; background:#fff; border:1px solid var(--border); border-radius:14px; padding:4px; box-shadow:0 8px 24px rgba(0,0,0,.18); z-index:4; max-width:calc(100% - 16px); }
.cardbar .name { font-weight:600; padding:0 8px; max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cb { display:inline-flex; flex-direction:column; align-items:center; gap:2px; min-width:52px; min-height:48px; padding:5px 8px; border:0; border-radius:10px; background:transparent; cursor:pointer; font-size:11px; }
.cb:hover { background:#eef1f5; }
.cb.primary { background:var(--accent); color:#fff; }
.cb.icon { min-width:40px; }
.zoombar { position:absolute; left:10px; bottom:38px; display:flex; flex-direction:column; gap:4px; }
.zb { width:44px; height:44px; border-radius:10px; border:1px solid var(--border); background:#fff; font-size:22px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.status .count { white-space:nowrap; }
.status { position:absolute; left:0; right:0; bottom:0; display:flex; gap:12px; align-items:center; padding:4px 10px; font-size:12px; color:var(--muted); background:rgba(255,255,255,.85); border-top:1px solid var(--border); padding-bottom:max(4px, env(safe-area-inset-bottom)); pointer-events:none; }
.status .notice { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.toast { position:absolute; left:50%; bottom:40px; transform:translateX(-50%); background:#1f2937; color:#fff; padding:12px 18px; border-radius:10px; max-width:90%; z-index:50; box-shadow:0 8px 24px rgba(0,0,0,.3); }
.toast.error { background:var(--danger); }

/* dialogs */
dialog { border:0; border-radius:16px; padding:0; width:min(560px, calc(100% - 20px)); max-height:calc(100% - 20px); box-shadow:0 20px 60px rgba(0,0,0,.35); color:var(--text); }
dialog::backdrop { background:rgba(0,0,0,.4); }
dialog > *, dialog form { padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
dialog h2 { margin:0 0 4px; font-size:19px; }
dialog label { display:flex; flex-direction:column; gap:4px; font-size:14px; }
dialog label > span { color:var(--muted); font-weight:500; }
dialog input[type=text], dialog input[type=search], dialog input[type=number], dialog select, dialog textarea { padding:10px 12px; border:1px solid var(--border); border-radius:8px; min-height:44px; background:#fff; width:100%; }
.row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.chk { flex-direction:row !important; align-items:center; gap:10px !important; min-height:36px; cursor:pointer; }
.chk input { width:20px; height:20px; }
fieldset { border:1px solid var(--border); border-radius:10px; padding:8px 12px; margin:0; display:flex; flex-direction:column; gap:2px; }
legend { color:var(--muted); font-size:13px; padding:0 4px; }
.rel { flex-direction:row; flex-wrap:wrap; gap:6px; }
.relopt { flex:1 1 45%; flex-direction:row !important; align-items:center; gap:10px !important; padding:8px 10px; border:1px solid var(--border); border-radius:10px; cursor:pointer; min-height:52px; }
.relopt:has(input:checked) { border-color:var(--accent); background:#e8efff; }
.relopt input { width:20px; height:20px; margin:0; }
.relopt span { display:flex; flex-direction:column; } .relopt small { color:var(--muted); }
.opts { display:flex; flex-direction:column; gap:8px; padding:6px 0; }
.warn { color:#92400e; background:#fef3c7; padding:8px 12px; border-radius:8px; margin:0; font-size:14px; }
.err { color:var(--danger); font-weight:600; margin:0; }
.hint { color:var(--muted); font-size:12px; margin:0; }
details summary { cursor:pointer; color:var(--accent); font-weight:500; min-height:32px; display:flex; align-items:center; }
details[open] { display:flex; flex-direction:column; gap:10px; }
.btns { display:flex; gap:8px; justify-content:flex-end; align-items:center; margin-top:6px; flex-wrap:wrap; }
.btns .sp { flex:1; }
.btn { padding:10px 18px; min-height:44px; border-radius:10px; border:1px solid var(--border); background:#fff; cursor:pointer; font-weight:500; }
.btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
.btn.danger { color:var(--danger); border-color:#fca5a5; }
.btn:hover { filter:brightness(.96); }
.photoRow { display:flex; gap:14px; align-items:center; }
.photoRow .col { display:flex; flex-direction:column; gap:6px; }
.photoPreview { width:88px; height:88px; border-radius:50%; background:#e5e7eb center/cover no-repeat; flex:none; border:1px solid var(--border); }
.photoPreview.square { border-radius:8px; }
.links { display:flex; flex-direction:column; gap:6px; font-size:14px; }
.links .lk { display:flex; align-items:center; gap:8px; justify-content:space-between; padding:6px 0; border-top:1px solid var(--border); }
.links .lk button { padding:6px 10px; min-height:36px; }
.cropWrap { display:flex; justify-content:center; }
#cropCanvas { border-radius:10px; touch-action:none; cursor:move; max-width:100%; background:#222; }
.expGrid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.expOpts { display:flex; flex-direction:column; gap:10px; }
.expPrev { display:flex; flex-direction:column; gap:8px; align-items:center; }
#prevCanvas { max-width:100%; border:1px solid var(--border); box-shadow:0 2px 12px rgba(0,0,0,.2); background:#fff; }
#dlgExport { width:min(860px, calc(100% - 20px)); }
@media (max-width: 640px) { .expGrid { grid-template-columns:1fr; } }
.help { font-size:15px; line-height:1.5; max-height:60vh; overflow:auto; }
.help h3 { margin:14px 0 4px; font-size:16px; } .help p, .help ul { margin:4px 0; } .help kbd { background:#eef1f5; border:1px solid var(--border); border-radius:4px; padding:0 5px; font-size:13px; }
.modeRow { display:flex; }
@media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }

</style>
</head>
<body>
<header class="bar" id="topbar">
  <h1 id="appTitle">Arbre familial</h1>
  <div class="search" id="searchBox">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
    <input id="search" type="search" autocomplete="off" placeholder="Rechercher une personne…" aria-label="Rechercher une personne" aria-controls="searchResults">
    <ul id="searchResults" role="listbox" hidden></ul>
  </div>
  <div class="actions">
    <button id="btnUndo" class="tb" aria-label="Annuler" title="Annuler (Ctrl+Z)"><svg class="ic" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg><span>Annuler</span></button>
    <button id="btnRedo" class="tb" aria-label="Rétablir" title="Rétablir (Ctrl+Y)"><svg class="ic" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg><span>Rétablir</span></button>
    <button id="btnOpen" class="tb" aria-label="Ouvrir (JSON)"><svg class="ic" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Ouvrir (JSON)</span></button>
    <button id="btnSave" class="tb" aria-label="Enregistrer (JSON)"><svg class="ic" viewBox="0 0 24 24"><path d="M4 4h12l4 4v12H4z"/><path d="M8 4v5h7V4M7 20v-6h10v6"/></svg><span>Enregistrer (JSON)</span></button>
    <button id="btnExport" class="tb primary" aria-label="Exporter"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 17v3h16v-3"/></svg><span>Exporter</span></button>
    <button id="btnSettings" class="tb" aria-label="Réglages"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Réglages</span></button>
    <button id="btnHelp" class="tb" aria-label="Aide"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></svg><span>Aide</span></button>
    <button id="btnMore" class="tb" aria-label="Menu" aria-haspopup="true" aria-expanded="false"><svg class="ic" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>
    <div id="moreMenu" class="menu" hidden role="menu">
      <button role="menuitem" id="mOpen" class="narrow">Ouvrir (JSON)</button>
      <button role="menuitem" id="mSave" class="narrow">Enregistrer (JSON)</button>
      <button role="menuitem" id="mRedo" class="narrow">Rétablir</button>
      <button role="menuitem" id="mSettings" class="narrow">Réglages</button>
      <button role="menuitem" id="mHelp" class="narrow">Aide</button>
      <button role="menuitem" id="btnFitMenu">Voir tout l’arbre</button>
      <button role="menuitem" id="btnExample">Charger l’exemple (famille recomposée)</button>
      <button role="menuitem" id="btnNew">Nouvel arbre</button>
    </div>
  </div>
</header>

<main id="main">
  <canvas id="tree" tabindex="0" role="application" aria-label="Arbre familial. Flèches : naviguer entre les personnes, Entrée : modifier, + : ajouter un proche."></canvas>
  <div id="live" class="sr" aria-live="polite"></div>
  <div id="empty" class="empty" hidden>
    <p id="emptyHint"></p>
    <button id="btnFirst" class="big primary"></button>
    <div class="row"><button id="btnExample2" class="big"></button><button id="btnOpen2" class="big"></button></div>
  </div>
  <div id="cardBar" class="cardbar" hidden role="toolbar" aria-label="Actions sur la personne">
    <span id="cardBarName" class="name"></span>
    <button id="cbEdit" class="cb"><svg class="ic" viewBox="0 0 24 24"><path d="M4 20h4l10-10-4-4L4 16z"/><path d="m12 8 4 4"/></svg><span>Modifier</span></button>
    <button id="cbAdd" class="cb primary"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Ajouter</span></button>
    <button id="cbCenter" class="cb"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/></svg><span>Centrer</span></button>
    <button id="cbCollapse" class="cb"><svg class="ic" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg><span></span></button>
    <button id="cbClose" class="cb icon" aria-label="Fermer"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="zoombar">
    <button id="zIn" class="zb" aria-label="Zoom avant">+</button>
    <button id="zOut" class="zb" aria-label="Zoom arrière">−</button>
    <button id="zFit" class="zb" aria-label="Voir tout l’arbre"><svg class="ic" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
  <div class="status"><span id="count"></span><span id="autosave" class="notice"></span></div>
  <div id="toast" class="toast" role="status" hidden></div>
</main>

<input type="file" id="fileJson" accept=".json,application/json" hidden>
<input type="file" id="filePhoto" accept="image/*" hidden>
<input type="file" id="filePhotoCam" accept="image/*" capture="environment" hidden>

<!-- Add relative -->
<dialog id="dlgAdd" aria-labelledby="dlgAddTitle">
  <form id="formAdd" novalidate>
    <h2 id="dlgAddTitle"></h2>
    <fieldset class="rel"><legend id="relLegend"></legend>
      <label class="relopt"><input type="radio" name="rel" value="child" checked><span><b id="lblChild"></b><small id="hintChild"></small></span></label>
      <label class="relopt"><input type="radio" name="rel" value="partner"><span><b id="lblPartner"></b><small id="hintPartner"></small></span></label>
      <label class="relopt"><input type="radio" name="rel" value="parent"><span><b id="lblParent"></b><small id="hintParent"></small></span></label>
      <label class="relopt"><input type="radio" name="rel" value="sibling"><span><b id="lblSibling"></b><small id="hintSibling"></small></span></label>
    </fieldset>
    <div id="optChild" class="opts"><label><span id="lblWith"></span><select id="selUnion"></select></label><label class="chk"><input type="checkbox" id="chkAdopted"><span id="lblAdopted"></span></label></div>
    <div id="optSibling" class="opts"><div id="sibChoices"></div><p id="sibNeed" class="warn" hidden></p></div>
    <p id="parentFull" class="warn" hidden></p>
    <div class="modeRow"><label class="chk"><input type="checkbox" id="chkExisting"><span id="lblExisting"></span></label></div>
    <div id="existingBox" hidden><input type="search" id="existingSearch" autocomplete="off"><ul id="existingResults" role="listbox"></ul><input type="hidden" id="existingId"></div>
    <div id="newBox">
      <label><span id="lblFirst"></span><input id="aFirst" type="text" autocomplete="off" required autofocus enterkeyhint="done"></label>
      <details id="aMore"><summary id="aMoreLbl"></summary>
        <label><span id="lblLast"></span><input id="aLast" type="text" autocomplete="off"></label>
        <div class="row2"><label><span id="lblBirth"></span><input id="aBirth" type="text" inputmode="numeric" autocomplete="off"></label><label><span id="lblDeath"></span><input id="aDeath" type="text" inputmode="numeric" autocomplete="off"></label></div>
        <label><span id="lblPlace"></span><input id="aPlace" type="text" autocomplete="off"></label>
        <p class="hint" id="aDateHint"></p>
      </details>
    </div>
    <p id="aErr" class="err" role="alert" hidden></p>
    <div class="btns"><button type="button" class="btn" id="aCancel"></button><button type="submit" class="btn primary" id="aSave"></button></div>
  </form>
</dialog>

<!-- Edit person -->
<dialog id="dlgEdit" aria-labelledby="dlgEditTitle">
  <form id="formEdit" novalidate>
    <h2 id="dlgEditTitle"></h2>
    <div class="photoRow">
      <div id="ePhoto" class="photoPreview" aria-hidden="true"></div>
      <div class="col"><button type="button" class="btn" id="ePick"></button><button type="button" class="btn" id="eCam"></button><button type="button" class="btn" id="eRemovePhoto"></button></div>
    </div>
    <label><span id="elblFirst"></span><input id="eFirst" type="text" autocomplete="off" required></label>
    <label><span id="elblLast"></span><input id="eLast" type="text" autocomplete="off"></label>
    <div class="row2"><label><span id="elblBirth"></span><input id="eBirth" type="text" inputmode="numeric" autocomplete="off"></label><label><span id="elblDeath"></span><input id="eDeath" type="text" inputmode="numeric" autocomplete="off"></label></div>
    <label><span id="elblPlace"></span><input id="ePlace" type="text" autocomplete="off"></label>
    <label><span id="elblNotes"></span><textarea id="eNotes" rows="2"></textarea></label>
    <p class="hint" id="eDateHint"></p>
    <div id="eLinks" class="links"></div>
    <p id="eErr" class="err" role="alert" hidden></p>
    <div class="btns"><button type="button" class="btn danger" id="eDelete"></button><span class="sp"></span><button type="button" class="btn" id="eCancel"></button><button type="submit" class="btn primary" id="eSave"></button></div>
  </form>
</dialog>

<!-- Confirm -->
<dialog id="dlgConfirm" aria-labelledby="confirmTitle"><h2 id="confirmTitle"></h2><p id="confirmText"></p><div class="btns"><button class="btn" id="cCancel"></button><button class="btn danger" id="cOk"></button></div></dialog>

<!-- Crop -->
<dialog id="dlgCrop" aria-labelledby="cropTitle"><h2 id="cropTitle"></h2><p class="hint" id="cropHint"></p>
  <div class="cropWrap"><canvas id="cropCanvas" width="280" height="280"></canvas></div>
  <div class="row2"><label><span id="lblShape"></span><select id="cropShape"><option value="circle"></option><option value="square"></option></select></label><label><span id="lblZoom"></span><input type="range" id="cropZoom" min="1" max="4" step="0.01" value="1"></label></div>
  <div class="btns"><button class="btn" id="cropCancel"></button><button class="btn primary" id="cropOk"></button></div></dialog>

<!-- Settings -->
<dialog id="dlgSettings" aria-labelledby="setTitle"><form id="formSettings"><h2 id="setTitle"></h2>
  <fieldset><legend id="lblTheme"></legend><label class="chk"><input type="radio" name="theme" value="modern"><span id="lblModern"></span></label><label class="chk"><input type="radio" name="theme" value="vintage"><span id="lblVintage"></span></label></fieldset>
  <fieldset><legend id="lblFields"></legend>
    <label class="chk"><input type="checkbox" id="sLast"><span id="lblSLast"></span></label>
    <label class="chk"><input type="checkbox" id="sDates"><span id="lblSDates"></span></label>
    <label class="chk"><input type="checkbox" id="sPlace"><span id="lblSPlace"></span></label>

function t(key, ...args) {

// ---------------------------------------------------------------------------
// Data model: persons, unions, photos. JSON schema versioned. Pure functions.
// ---------------------------------------------------------------------------
const SCHEMA = 'family-tree', SCHEMA_VERSION = 1;

function uid() { return Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4); }

function defaultSettings() {
  return { theme: 'modern', showLastName: true, showDates: true, showPlace: true, showPhoto: true, showPlus: true, title: '', subtitle: '' };
}

function emptyState() {
  return { persons: [], unions: [], photos: {}, settings: defaultSettings(), seq: 0 };
}

// --- dates: stored as '', 'YYYY', 'YYYY-MM' or 'YYYY-MM-DD' -------------------
function parseDateInput(s) {
  s = (s || '').trim();
  if (!s) return '';
  let m;
  if ((m = s.match(/^(\d{1,4})$/))) return m[1].padStart(4, '0');
  if ((m = s.match(/^(\d{1,2})\/(\d{4})$/))) return `${m[2]}-${m[1].padStart(2, '0')}`;
  if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/))) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  if ((m = s.match(/^(\d{4})-(\d{1,2})$/))) return `${m[1]}-${m[2].padStart(2, '0')}`;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  return null; // invalid
}
function isValidStoredDate(s) { return s === '' || /^\d{4}(-\d{2}(-\d{2})?)?$/.test(s); }
function formatDate(s) { // stored -> French display
  if (!s) return '';
  const p = s.split('-');
  if (p.length === 1) return p[0];
  if (p.length === 2) return `${p[1]}/${p[0]}`;
  return `${p[2]}/${p[1]}/${p[0]}`;
}
function dateYear(s) { return s ? parseInt(s.slice(0, 4), 10) : NaN; }
function dateToInput(s) { return formatDate(s); }

// --- indexes -----------------------------------------------------------------
function buildIndex(st) {
  const byId = new Map(), unionById = new Map(), unionsOf = new Map(), parentUnionOf = new Map();
  for (const p of st.persons) { byId.set(p.id, p); unionsOf.set(p.id, []); }
  for (const u of st.unions) {
    unionById.set(u.id, u);
    for (const pid of u.partners) if (unionsOf.has(pid)) unionsOf.get(pid).push(u);
    for (const c of u.children) parentUnionOf.set(c.id, u);
  }
  return { byId, unionById, unionsOf, parentUnionOf };
}

function parentsOf(idx, pid) { const u = idx.parentUnionOf.get(pid); return u ? u.partners.slice() : []; }
function childrenOf(idx, pid) { return (idx.unionsOf.get(pid) || []).flatMap(u => u.children.map(c => c.id)); }

function isAncestor(idx, a, b) { // is a an ancestor of b?
  const seen = new Set(); const stack = [b];
  while (stack.length) {
    const x = stack.pop();
    for (const p of parentsOf(idx, x)) { if (p === a) return true; if (!seen.has(p)) { seen.add(p); stack.push(p); } }
  }
  return false;
}
function hasCycle(idx, persons) {
  const state = new Map();
  for (const p of persons) {
    if (state.get(p.id)) continue;
    const stack = [[p.id, 0]]; state.set(p.id, 1);
    while (stack.length) {
      const top = stack[stack.length - 1]; const ps = parentsOf(idx, top[0]);
      if (top[1] < ps.length) {
        const n = ps[top[1]++]; const s = state.get(n);
        if (s === 1) return true;
        if (!s) { state.set(n, 1); stack.push([n, 0]); }
      } else { state.set(top[0], 2); stack.pop(); }
    }
  }
  return false;
}

function fullName(p) { return [p.first, p.last].filter(Boolean).join(' ') || '?'; }

// --- person ops (mutating st; callers snapshot for undo) ----------------------
function newPerson(st, f, idx) {
  const p = { id: uid(), first: (f.first || '').trim(), last: (f.last || '').trim(), birth: f.birth || '', death: f.death || '',
    place: (f.place || '').trim(), notes: (f.notes || '').trim(), photo: f.photo || null, photoShape: f.photoShape || 'circle', seq: ++st.seq };
  if (f.collapsed) p.collapsed = true;
  st.persons.push(p); if (idx) { idx.byId.set(p.id, p); idx.unionsOf.set(p.id, []); } return p;
}
function newUnion(st, partners) { const u = { id: uid(), partners: partners.slice(), children: [], seq: ++st.seq }; st.unions.push(u); return u; }

function sortChildren(st, idx, u) {
  const key = (c) => { const p = idx.byId.get(c.id); const y = p ? dateYear(p.birth) : NaN; return isNaN(y) ? 1e9 : y; };
  u.children.sort((a, b) => key(a) - key(b) || (idx.byId.get(a.id)?.seq || 0) - (idx.byId.get(b.id)?.seq || 0));
}

// Link validations: return error key or null
function canBePartners(idx, a, b) {
  if (a === b) return 'errSelf';
  if (!idx.byId.has(a) || !idx.byId.has(b)) return 'errUnknown';
  if ((idx.unionsOf.get(a) || []).some(u => u.partners.includes(b))) return 'errAlreadyPartners';
  if (isAncestor(idx, a, b) || isAncestor(idx, b, a)) return 'errAncestor';
  return null;
}
function canBeChildOf(idx, u, child) {
  if (!idx.byId.has(child)) return 'errUnknown';
  if (u.partners.includes(child)) return 'errPartnerAsChild';
  if (u.children.some(c => c.id === child)) return 'errAlreadyChild';
  if (idx.parentUnionOf.has(child)) return 'errHasParents';
  for (const p of u.partners) if (p === child || isAncestor(idx, child, p)) return 'errAncestor';
  return null;
}
function canBeParentOf(idx, parent, child) {
  if (parent === child) return 'errSelf';
  if (!idx.byId.has(parent) || !idx.byId.has(child)) return 'errUnknown';
  const u = idx.parentUnionOf.get(child);
  if (u && u.partners.length >= 2) return 'parentsFull';
  if (u && u.partners.includes(parent)) return 'errAlreadyChild';
  if (isAncestor(idx, child, parent)) return 'errAncestor';
  return null;
}

// Add partner: returns union
function addPartner(st, idx, pid, partnerId) {
  const err = canBePartners(idx, pid, partnerId); if (err) throw new Error(t(err));
  return newUnion(st, [pid, partnerId]);
}
// Add child to a union (or create single-parent union for pid)
function addChildTo(st, idx, unionOrNull, pid, childId, adopted) {
  let u = unionOrNull;
  if (!u) { u = (idx.unionsOf.get(pid) || []).find(x => x.partners.length === 1); if (!u) u = newUnion(st, [pid]); }
  const err = canBeChildOf(idx, u, childId); if (err) throw new Error(t(err));
  u.children.push(adopted ? { id: childId, rel: 'adopted' } : { id: childId });
  sortChildren(st, idx, u);
  return u;
}
function addParentTo(st, idx, childId, parentId) {
  const err = canBeParentOf(idx, parentId, childId); if (err) throw new Error(t(err));
  let u = idx.parentUnionOf.get(childId);
  if (u) { u.partners.push(parentId); } else { u = newUnion(st, [parentId]); u.children.push({ id: childId }); }
  return u;
}
function removePerson(st, pid) {
  st.persons = st.persons.filter(p => p.id !== pid);
  for (const u of st.unions) { u.partners = u.partners.filter(x => x !== pid); u.children = u.children.filter(c => c.id !== pid); }
  st.unions = st.unions.filter(u => u.partners.length > 0 && (u.partners.length === 2 || u.children.length > 0));
}
function unlinkChild(st, pid) { for (const u of st.unions) u.children = u.children.filter(c => c.id !== pid); st.unions = st.unions.filter(u => u.partners.length === 2 || u.children.length > 0); }
function removeUnion(st, uid_) { st.unions = st.unions.filter(u => u.id !== uid_); }

// --- JSON --------------------------------------------------------------------
function toJSON(st) {
  const out = { schema: SCHEMA, version: SCHEMA_VERSION, exportedAt: new Date().toISOString(), settings: st.settings,
    persons: st.persons.map(p => { const o = { ...p }; delete o.seq; if (!o.collapsed) delete o.collapsed; return o; }),
    unions: st.unions.map(u => ({ id: u.id, partners: u.partners, children: u.children })), photos: st.photos };
  return JSON.stringify(out);
}
// Validate + normalise. Throws Error with French message.
function fromJSON(text) {
  let d; try { d = JSON.parse(text); } catch (e) { throw new Error(t('jsonBadFile')); }
  if (!d || typeof d !== 'object' || d.schema !== SCHEMA) throw new Error(t('jsonBadSchema'));
  if (typeof d.version !== 'number' || d.version > SCHEMA_VERSION) throw new Error(t('jsonBadVersion', d.version));
  if (!Array.isArray(d.persons)) throw new Error(t('jsonBadPersons'));
  const st = emptyState(); const ids = new Set();
  d.persons.forEach((p, i) => {
    if (!p || typeof p !== 'object' || typeof p.id !== 'string' || !p.id || typeof p.first !== 'string') throw new Error(t('jsonBadPerson', i));
    if (ids.has(p.id)) throw new Error(t('jsonDupId', p.id)); ids.add(p.id);
    const q = { id: p.id, first: p.first, last: String(p.last || ''), birth: isValidStoredDate(p.birth) ? p.birth : '', death: isValidStoredDate(p.death) ? p.death : '',
      place: String(p.place || ''), notes: String(p.notes || ''), photo: typeof p.photo === 'string' ? p.photo : null, photoShape: p.photoShape === 'square' ? 'square' : 'circle', seq: ++st.seq };
    if (p.collapsed) q.collapsed = true;
    st.persons.push(q);
  });
  const seenChild = new Set();
  (Array.isArray(d.unions) ? d.unions : []).forEach((u, i) => {
    if (!u || typeof u !== 'object' || !Array.isArray(u.partners) || u.partners.length < 1 || u.partners.length > 2) throw new Error(t('jsonBadUnion', i));
    for (const pid of u.partners) if (!ids.has(pid)) throw new Error(t('jsonBadRef', pid));
    const children = (Array.isArray(u.children) ? u.children : []).map(c => {
      const o = typeof c === 'string' ? { id: c } : c;
      if (!o || typeof o.id !== 'string' || !ids.has(o.id)) throw new Error(t('jsonBadRef', o && o.id));
      if (seenChild.has(o.id)) throw new Error(t('jsonTwoParents', o.id)); seenChild.add(o.id);
      return o.rel === 'adopted' ? { id: o.id, rel: 'adopted' } : { id: o.id };
    });
    if (u.partners[0] === u.partners[1]) throw new Error(t('jsonBadUnion', i));
    st.unions.push({ id: typeof u.id === 'string' && u.id ? u.id : uid(), partners: u.partners.slice(), children, seq: ++st.seq });
  });
  if (d.photos && typeof d.photos === 'object') for (const k in d.photos) if (typeof d.photos[k] === 'string' && d.photos[k].startsWith('data:image/')) st.photos[k] = d.photos[k];
  for (const p of st.persons) if (p.photo && !st.photos[p.photo]) p.photo = null;
  st.settings = { ...defaultSettings(), ...(d.settings && typeof d.settings === 'object' ? d.settings : {}) };
  if (st.settings.theme !== 'vintage') st.settings.theme = 'modern';
  const idx = buildIndex(st);
  if (hasCycle(idx, st.persons)) throw new Error(t('jsonCycle'));
  return st;
}

// --- example + generator -----------------------------------------------------
function exampleTree(st) {
  const P = (first, last, birth, death, place) => newPerson(st, { first, last, birth, death, place });
  const jean = P('Jean', 'Martin', '1940-03-12', '2015-11-02', 'Lyon'), marie = P('Marie', 'Dubois', '1942-07-01', '', 'Grenoble');
  const pierre = P('Pierre', 'Martin', '1965-05-20', '', 'Lyon'), sophie = P('Sophie', 'Martin', '1968-09-14', '', 'Lyon');
  const claire = P('Claire', 'Petit', '1950', '', 'Marseille'), lucas = P('Lucas', 'Martin', '1980-01-30', '', 'Marseille');
  const paul = P('Paul', 'Leroy', '1938', '2020', 'Annecy'), anne = P('Anne', 'Moreau', '1945', '', 'Annecy');
  const nina = P('Nina', 'Leroy', '1975-12-24', '', 'Annecy'), emma = P('Emma', 'Leroy', '1983-04-08', '', 'Grenoble');

const HELP_HTML = `
<h3>Ajouter des membres</h3>
<p>Touchez une carte puis <b>Ajouter</b> (ou le bouton <b>+</b> sur la carte). Choisissez le lien : <b>enfant</b>, <b>partenaire</b>, <b>parent</b> ou <b>frère / sœur</b>. Seul le prénom est obligatoire ; <kbd>Entrée</kbd> enregistre et la vue se centre sur la nouvelle personne. Vous pouvez aussi <b>lier une personne déjà dans l’arbre</b> (par exemple marier deux personnes de deux branches).</p>
<h3>Familles recomposées</h3>
<ul><li>Une personne peut avoir plusieurs partenaires (successifs ou simultanés) : ajoutez un partenaire à chaque fois. Les enfants de chaque union sont regroupés sous le trait de <i>cette</i> union.</li>
<li>Pour un enfant d’un parent seul, choisissez « Parent seul » dans la liste des partenaires.</li>
<li>Demi-frères et demi-sœurs : « Frère / sœur » puis « même parent X » ; l’autre parent peut être ajouté ensuite.</li>
<li>Les enfants adoptés sont reliés par un trait pointillé. Les beaux-parents et beaux-enfants apparaissent naturellement : l’enfant est sous l’union de ses parents, à côté du nouveau partenaire.</li>
<li>Les liens impossibles (une personne ancêtre d’elle-même) sont refusés.</li></ul>
<h3>Naviguer</h3>
<p>Glissez pour déplacer, pincez ou utilisez la molette pour zoomer. Recherchez un nom en haut pour aller directement sur une personne. <b>Réduire la branche</b> masque les descendants d’une personne. Au clavier : flèches, <kbd>Entrée</kbd>, <kbd>+</kbd>, <kbd>Échap</kbd>, <kbd>Ctrl</kbd>+<kbd>Z</kbd> pour annuler.</p>
<h3>Enregistrer</h3>
<p>Le fichier <b>JSON</b> (« Enregistrer ») est la vraie sauvegarde : il contient tout, photos comprises, et se rouvre avec « Ouvrir ». Un brouillon est aussi gardé automatiquement dans ce navigateur.</p>
<h3>Exporter pour imprimer</h3>
<p>« Exporter » produit une image <b>PNG</b> haute résolution, un <b>PDF</b> ou un <b>SVG</b> vectoriel, l’arbre entier sur une seule feuille (A4 à A0 ou taille personnalisée). Les photos sont intégrées en pleine résolution et le texte reste net. Si une résolution dépasse les capacités du navigateur, elle est plafonnée et indiquée ; le PDF et le SVG n’ont pas de limite.</p>`;

// --- example photos (generated avatars so the demo exercises the photo pipeline) ----------------------------

  g.fillStyle = '#fff'; g.font = 'bold 110px Helvetica, Arial, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(initials, 150, 160); return c.toDataURL('image/jpeg', 0.85); }
